# Publishes prepared release branches to WordPress.org SVN on their dates.
#
# Release queue: .github/releases.json  ->  [{ "version", "branch", "date" (UTC, YYYY-MM-DD) }]
#
# - Scheduled run: every day 04:00 UTC (10:00 Bangladesh time). Publishes the release whose
#   date is today. Skips if that version is already on WordPress.org, and refuses to publish
#   if an earlier queued version is not live yet (keeps the order 1.5.0 -> 1.6.0 -> ...).
# - Manual run (Actions tab -> Run workflow): choose a version; dry run is ticked by default,
#   which checks everything and builds the SVN commit without sending it.
#
# Cancel one release: remove it from releases.json. Cancel all: disable this workflow.
# Move a release: change its date in releases.json.
#
# Requires repository secrets SVN_USERNAME and SVN_PASSWORD. The SVN password is not your
# WordPress.org login password: generate it at https://profiles.wordpress.org/me/profile/edit/
# -> Account & Security -> SVN credentials -> Generate Password.

name: Scheduled WordPress.org release

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version from .github/releases.json (e.g. 1.6.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build everything, do not commit to WordPress.org)'
        type: boolean
        default: true

env:
  SLUG: codecarebd-bkash-nagad-rocket-payoneer-gateway

permissions:
  contents: write

concurrency:
  group: wporg-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      version: ${{ steps.pick.outputs.version }}
      branch: ${{ steps.pick.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/releases.json
          sparse-checkout-cone-mode: false

      - name: Pick the release to publish
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          if [ "$EVENT" = "schedule" ]; then
            entry="$(jq -c --arg d "$today" '[.[] | select(.date == $d)] | first // empty' .github/releases.json)"
            if [ -z "$entry" ]; then echo "No release scheduled for $today."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          else
            entry="$(jq -c --arg v "$WANT" '[.[] | select(.version == $v)] | first // empty' .github/releases.json)"
            if [ -z "$entry" ]; then echo "::error::Version $WANT is not in .github/releases.json"; exit 1; fi
          fi
          version="$(jq -r .version <<<"$entry")"
          branch="$(jq -r .branch <<<"$entry")"

          live() { [ "$(curl -s -o /dev/null -w '%{http_code}' "https://plugins.svn.wordpress.org/$SLUG/tags/$1/")" = "200" ]; }

          if live "$version"; then
            echo "Version $version is already on WordPress.org. Nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Every version queued before this one must already be live (only enforced for real publishing).
          if [ "$EVENT" = "schedule" ] || [ "${{ inputs.dry_run }}" != "true" ]; then
            for earlier in $(jq -r --arg v "$version" 'map(.version) as $all | ($all | to_entries | map(select(.value == $v)) | .[0].key) as $i | $all[0:$i][]' .github/releases.json); do
              if ! live "$earlier"; then
                echo "::error::$earlier is queued before $version but is not on WordPress.org yet. Not publishing $version."
                exit 1
              fi
            done
          fi
          echo "Publishing $version from $branch."
          { echo "run=true"; echo "version=$version"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.branch }}
          fetch-depth: 0

      - name: Pre-flight checks
        run: |
          set -euo pipefail
          grep -q "^ \* Version: $RELEASE_VERSION$" ccd-payment-gateway.php || { echo "::error::Plugin header Version is not $RELEASE_VERSION"; exit 1; }
          grep -q "define('CCD_PAYMENT_GATEWAY_VERSION', '$RELEASE_VERSION');" ccd-payment-gateway.php || { echo "::error::CCD_PAYMENT_GATEWAY_VERSION is not $RELEASE_VERSION"; exit 1; }
          grep -q "^Stable tag: $RELEASE_VERSION$" readme.txt || { echo "::error::readme.txt Stable tag is not $RELEASE_VERSION"; exit 1; }
          grep -q "^= $RELEASE_VERSION" readme.txt || { echo "::error::readme.txt has no changelog entry for $RELEASE_VERSION"; exit 1; }
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Pre-flight checks passed for $RELEASE_VERSION."

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ env.RELEASE_VERSION }}

      - name: Confirm on WordPress.org and tag in git
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://plugins.svn.wordpress.org/$SLUG/tags/$RELEASE_VERSION/")"
          [ "$code" = "200" ] || { echo "::error::tags/$RELEASE_VERSION not found on WordPress.org after deploy"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION (WordPress.org)"
          git push origin "v$RELEASE_VERSION"
          echo "### Released $RELEASE_VERSION to WordPress.org" >> "$GITHUB_STEP_SUMMARY"
